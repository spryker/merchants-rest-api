resource:
    name: Merchants
    shortName: merchants
    description: 'Storefront merchants'

    provider: Spryker\Glue\MerchantsRestApi\Api\Storefront\Provider\MerchantsStorefrontProvider

    paginationEnabled: false

    operations:
        - type: Get
          description: 'Retrieve a merchant by reference'
          extraProperties:
              notFoundCode: '3501'
              notFoundMessage: 'Merchant not found.'
          openapiContext:
              responses:
                  200:
                      description: 'Merchant returned.'
                  404:
                      description: 'Merchant not found.'

        - type: GetCollection
          uriTemplate: '/merchants'
          description: 'Retrieve a paginated list of merchants'
          openapiContext:
              responses:
                  200:
                      description: 'Merchant collection returned.'
              parameters:
                  - name: 'page[limit]'
                    in: query
                    description: 'Maximum number of merchants per page.'
                    required: false
                    schema:
                        type: integer
                    example: 10
                  - name: 'page[offset]'
                    in: query
                    description: 'Offset of the first merchant to return (zero-based).'
                    required: false
                    schema:
                        type: integer
                    example: 0

    includes:
        - relationshipName: merchant-addresses
          targetResource: MerchantAddresses
          uriTemplate: /merchants/{merchantReference}/merchant-addresses
          uriVariableMappings:
              merchantReference: merchantReference

        - relationshipName: merchant-opening-hours
          targetResource: MerchantOpeningHours
          uriTemplate: /merchants/{merchantReference}/merchant-opening-hours
          uriVariableMappings:
              merchantReference: merchantReference

    properties:
        merchantReference:
            type: string
            identifier: true
            writable: false
            readable: true
            description: 'Unique merchant reference'
            openapiContext:
                example: 'MER000001'

        merchantName:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Merchant name'
            openapiContext:
                example: 'Spryker'

        merchantUrl:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Merchant storefront URL'
            openapiContext:
                example: '/en/merchant/spryker'

        contactPersonRole:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Contact person role'
            openapiContext:
                example: 'Customer Service Manager'

        contactPersonTitle:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Contact person title'
            openapiContext:
                example: 'Mr'

        contactPersonFirstName:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Contact person first name'
            openapiContext:
                example: 'Harald'

        contactPersonLastName:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Contact person last name'
            openapiContext:
                example: 'Schmidt'

        contactPersonPhone:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Contact person phone'
            openapiContext:
                example: '+49 30 208498350'

        logoUrl:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Merchant logo URL'
            openapiContext:
                example: 'https://cdn.acme.com/logo.png'

        publicEmail:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Public merchant email'
            openapiContext:
                example: 'spryker@acme.com'

        publicPhone:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Public merchant phone'
            openapiContext:
                example: '+49 30 208498350'

        description:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Merchant description'
            openapiContext:
                example: 'Spryker is the leading composable commerce platform.'

        bannerUrl:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Merchant banner URL'
            openapiContext:
                example: 'https://cdn.acme.com/banner.png'

        deliveryTime:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Estimated delivery time'
            openapiContext:
                example: '2-3 business days'

        faxNumber:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Fax number'
            openapiContext:
                example: '+49 30 208498351'

        legalInformation:
            type: object
            objectName: MerchantLegalInformation
            writable: false
            readable: true
            required: false
            description: 'Legal information block'
            properties:
                terms:
                    type: string
                    description: 'Terms and conditions text.'
                    openapiContext:
                        example: 'Terms and conditions text'
                cancellationPolicy:
                    type: string
                    description: 'Cancellation policy text.'
                    openapiContext:
                        example: 'Cancellation policy text'
                imprint:
                    type: string
                    description: 'Imprint text.'
                    openapiContext:
                        example: 'Imprint text'
                dataPrivacy:
                    type: string
                    description: 'Data privacy policy text.'
                    openapiContext:
                        example: 'Data privacy policy text'

        pagination:
            type: object
            objectName: Pagination
            writable: false
            readable: true
            required: false
            description: 'Pagination metadata for the merchant collection. Populated only on the first item of a GET /merchants response and consumed by PaginationLinksResponseSubscriber to emit JSON:API top-level pagination links.'
            properties:
                numFound:
                    type: integer
                    description: 'Total number of items found.'
                    openapiContext:
                        example: 42
                currentPage:
                    type: integer
                    description: 'Current page number.'
                    openapiContext:
                        example: 1
                maxPage:
                    type: integer
                    description: 'Total number of pages.'
                    openapiContext:
                        example: 5
                currentItemsPerPage:
                    type: integer
                    description: 'Number of items per page.'
                    openapiContext:
                        example: 10
